name: ${COMPOSE_PROJECT_NAME:-yield-vintages}
services:
  db:
    container_name: ${COMPOSE_PROJECT_NAME:-yield-vintages}-db
    image: mysql:8.0
    environment: {MYSQL_ROOT_PASSWORD: rootdev, MYSQL_USER: app, MYSQL_PASSWORD: appdev, MYSQL_DATABASE: business}
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uapp -pappdev business -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 45
    ports: ["${DB_PORT:-17753}:3306"]
    volumes: ["db-data:/var/lib/mysql"]
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-yield-vintages}-redis
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-yield-vintages}-backend
    environment: &backend-env
      DATABASE_URL: mysql+pymysql://app:appdev@db:3306/business
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-yield-vintages-local-demo-change-before-production-2026}
      SEED_DEMO: "true"
    ports: ["${BACKEND_PORT:-19253}:8000"]
    volumes: ["report-files:/app/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 45
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-yield-vintages}-worker
    command: python -m src.worker
    environment: *backend-env
    volumes: ["report-files:/app/artifacts"]
    depends_on:
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time()-float(Path('/tmp/worker-heartbeat').read_text())<15"]
      interval: 3s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-yield-vintages}-frontend
    ports: ["${FRONTEND_PORT:-18253}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  db-data:
  redis-data:
  report-files:
